name: Publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Aplicación Angular (a partir de la fase 4)
      - if: hashFiles('package.json') != ''
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - if: hashFiles('package.json') != ''
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html

      # Página provisional mientras no exista la aplicación
      - if: hashFiles('package.json') == ''
        run: cp -r provisional dist

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  desplegar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
