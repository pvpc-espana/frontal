<!doctype html>
<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>

           font: 16px/1.5 system-ui, sans-serif; }

    p { color: var(--tenue); }
  </style>
</head>
<body>
